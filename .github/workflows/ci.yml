name: CI
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run gen:api:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest -q --cov=app --cov-report=term-missing --cov-report=json:.coverage.phase3b.json --cov-fail-under=90
      - run: python scripts/check_coverage.py .coverage.phase3b.json

  postgres-checks:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orders
          POSTGRES_PASSWORD: orders
          POSTGRES_DB: orders_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U orders -d orders_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_REDIS_URL: redis://localhost:6379/15
      TEST_DATABASE_URL: postgresql+psycopg://orders:orders@localhost:5432/orders_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest -q --cov=app --cov-report=term-missing --cov-report=json:.coverage.phase3b.json --cov-fail-under=90
      - run: python scripts/check_coverage.py .coverage.phase3b.json
