x-ready: &ready
  migrate:
    condition: service_completed_successfully
  postgres:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy
  redis:
    condition: service_started

x-application: &application
  build: .
  env_file: .env.example
  environment:
    FAILURE_INJECTION_ENABLED: ${FAILURE_INJECTION_ENABLED:-false}
    NOTIFICATIONS_BACKEND: ${NOTIFICATIONS_BACKEND:-console}
  volumes:
    - .:/app
  depends_on: *ready

services:
  mailpit:
    image: axllent/mailpit:latest
    profiles: [dev-tools]
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

  webhook-sink:
    image: python:3.12-alpine
    profiles: [dev-tools]
    command: python /app/scripts/webhook_sink.py
    volumes:
      - ./scripts/webhook_sink.py:/app/scripts/webhook_sink.py:ro
    ports:
      - "127.0.0.1:${WEBHOOK_SINK_PORT:-8090}:8080"

  migrate:
    build: .
    command: alembic upgrade head
    env_file: .env.example
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *application
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${API_PORT:-8000}:8000"

  worker:
    <<: *application
    command: celery -A app.workers.celery_app worker --loglevel=INFO --queues=orders,inventory,payments,shipments,dead_letter
    depends_on:
      <<: *ready
      api:
        condition: service_started

  scheduler:
    <<: *application
    command: celery -A app.workers.celery_app beat --loglevel=INFO
    depends_on:
      <<: *ready
      worker:
        condition: service_started

  integrations-worker:
    <<: *application
    command: celery -A app.workers.celery_app worker --loglevel=INFO --hostname=integrations@%h --queues=integrations --concurrency=${INTEGRATIONS_WORKER_CONCURRENCY:-2}
    stop_grace_period: 100s
    depends_on:
      <<: *ready
      api:
        condition: service_started

  outbox-relay:
    <<: *application
    command: python -m app.workers.outbox_relay

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
